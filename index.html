<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FDFBF7">
<title>Notre famille — routines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --ink:#34405C; --paper:#FDFBF7;
  --acc:#7FA3D4; --deep:#3D5578; --soft:#E4EDFA; --tint:#F4F8FE;
}
html,body{margin:0;padding:0}
body{
  font-family:Quicksand,'Nunito','Avenir Next',system-ui,-apple-system,sans-serif;
  color:var(--ink); background:var(--paper); min-height:100vh;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid rgba(52,64,92,.45);outline-offset:3px;border-radius:14px}
#bg{position:fixed;inset:0;z-index:-2;transition:background .6s ease}
#fx{position:fixed;inset:0;z-index:60;pointer-events:none}
.shell{max-width:640px;margin:0 auto;padding:20px 16px 70px}
.shell.wide{max-width:820px}
h1,h2,h3,h4{margin:0}

/* ---------- accueil ---------- */
.home-top{text-align:center;padding:26px 0 6px}
.home-top .dt{font-size:13.5px;opacity:.5;font-weight:600}
.home-top h1{font-size:38px;font-weight:700;letter-spacing:-.5px;margin:8px 0 2px}
.home-top p{margin:0 0 26px;opacity:.55;font-size:15.5px}
.kids{display:flex;flex-direction:column;gap:14px}
.kid{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:18px 20px;
  border-radius:28px;background:#fff;box-shadow:0 14px 32px -20px rgba(52,64,92,.55);
  transition:transform .2s cubic-bezier(.2,.9,.3,1.2)}
.kid:active{transform:scale(.976)}
.kid .face{width:66px;height:66px;flex:0 0 66px;border-radius:22px;display:grid;place-items:center;font-size:33px}
.kid .nm{font-size:25px;font-weight:700;display:block;line-height:1.1}
.kid .sc{font-size:15px;font-weight:700;margin-top:3px;display:block}
.kid .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.mini-chip{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:#F1F3F8;white-space:nowrap}
.kid .go{margin-left:auto;font-size:26px;opacity:.28}
.linkbtn{display:block;margin:28px auto 0;font-size:14px;font-weight:700;opacity:.45;padding:12px 18px}
.badge-dot{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;
  background:#E9647A;color:#fff;font-size:12px;font-weight:700;margin-left:6px}

/* ---------- barre haute ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:14.5px;font-weight:700;
  padding:11px 16px;border-radius:999px;background:rgba(255,255,255,.85);min-height:46px;
  box-shadow:0 6px 16px -12px rgba(52,64,92,.9)}
.icon-btn{width:46px;height:46px;border-radius:999px;background:rgba(255,255,255,.85);font-size:18px;
  display:grid;place-items:center;position:relative}
.grow{margin-left:auto}
.head{display:flex;align-items:center;gap:15px}
.head .face{width:60px;height:60px;flex:0 0 60px;border-radius:21px;display:grid;place-items:center;font-size:29px}
.head h2{font-size:27px;font-weight:700;letter-spacing:-.3px}
.head .sub{font-size:13.5px;opacity:.55;margin-top:2px}
.score{margin-left:auto;text-align:right}
.score b{display:block;font-size:26px;font-weight:700;line-height:1}
.score span{font-size:11.5px;font-weight:700;opacity:.5}

/* ---------- onglets ---------- */
.tabs{display:flex;gap:7px;margin:20px 0 16px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:54px;padding:0 16px;border-radius:19px;font-size:14.5px;font-weight:700;
  display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.75);transition:background .2s,transform .2s}
.tab .em{font-size:17px}
.tab.on{color:#fff;transform:translateY(-1px)}
.tabs.equal .tab{flex:1;justify-content:center}

/* ---------- progression ---------- */
.card{border-radius:24px;padding:17px 19px;background:rgba(255,255,255,.82);margin-bottom:14px}
.card.solid{background:#fff;box-shadow:0 14px 34px -26px rgba(52,64,92,.9)}
.rowb{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.rowb .l{font-size:16.5px;font-weight:700}
.rowb .r{font-size:12.5px;font-weight:700;opacity:.55;text-align:right}
.bar{height:13px;border-radius:999px;margin-top:11px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;transition:width .55s cubic-bezier(.3,.9,.3,1)}
.stars{margin-top:10px;font-size:16px;letter-spacing:2px;line-height:1.5;word-break:break-word}
.stars .n{font-size:12.5px;letter-spacing:0;opacity:.5;font-weight:700}

/* ---------- étapes ---------- */
.glabel{font-size:13.5px;font-weight:700;margin:22px 0 9px 6px;opacity:.5}
.step{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:12px 16px 12px 12px;border-radius:22px;background:#fff;margin-bottom:9px;min-height:70px;
  box-shadow:0 10px 24px -20px rgba(52,64,92,.85);transition:transform .18s cubic-bezier(.2,.9,.3,1.2),background .3s}
.step:active{transform:scale(.985)}
.step::before{content:"";position:absolute;left:32px;top:-9px;height:9px;width:3px;border-radius:3px;background:rgba(52,64,92,.1)}
.step:first-of-type::before{display:none}
.step.on::before{background:currentColor;opacity:.35}
.step.big{min-height:92px;padding:14px 18px 14px 14px;border-radius:28px;gap:17px}
.step.done{box-shadow:none}
.box{flex:0 0 40px;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;transition:background .25s}
.step.big .box{flex:0 0 52px;width:52px;height:52px;border-radius:18px}
.box svg{width:60%;height:60%;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.box svg path{stroke-dasharray:30;stroke-dashoffset:0;animation:draw .34s cubic-bezier(.4,1,.5,1)}
@keyframes draw{from{stroke-dashoffset:30}}
.step .em{font-size:25px;width:32px;text-align:center}
.step.big .em{font-size:36px;width:46px}
.step .lb{font-size:16.5px;font-weight:600;line-height:1.27}
.step.big .lb{font-size:21px;font-weight:700}
.step.done .lb{opacity:.4;text-decoration:line-through;text-decoration-thickness:2px}
.step.done .em{opacity:.45}
.step .hint2{display:block;font-size:12px;font-weight:700;opacity:.5;margin-top:3px;text-decoration:none}
.tagp{margin-left:auto;flex:0 0 auto;font-size:13.5px;font-weight:700;padding:6px 11px;border-radius:999px;white-space:nowrap}

/* ---------- grilles ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.rw{background:#fff;border-radius:24px;padding:16px;text-align:center;
  box-shadow:0 12px 28px -22px rgba(52,64,92,.9);display:flex;flex-direction:column;gap:6px}
.rw .ic{font-size:36px}
.rw .nm{font-size:14.5px;font-weight:700;line-height:1.25}
.rw .co{font-size:13px;font-weight:700;opacity:.6}
.rw button{margin-top:auto;min-height:44px;border-radius:15px;font-size:13.5px;font-weight:700;color:#fff}
.rw button[disabled]{opacity:.35;cursor:default}
.med{background:#fff;border-radius:22px;padding:15px 12px;text-align:center;
  box-shadow:0 12px 28px -24px rgba(52,64,92,.9)}
.med .ic{font-size:34px;filter:grayscale(1);opacity:.3}
.med.got .ic{filter:none;opacity:1;animation:bob 3s ease-in-out infinite}
.med .nm{font-size:13.5px;font-weight:700;margin-top:6px}
.med .ds{font-size:11.5px;opacity:.5;font-weight:600;margin-top:3px;line-height:1.3}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}

/* ---------- historique ---------- */
.tx{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid rgba(52,64,92,.07)}
.tx:last-child{border-bottom:0}
.tx .ic{width:36px;height:36px;flex:0 0 36px;border-radius:12px;display:grid;place-items:center;font-size:16px;background:#F3F5FA}
.tx .tt{flex:1;min-width:0}
.tx .tt b{display:block;font-size:14.5px;font-weight:700;line-height:1.25}
.tx .tt span{font-size:11.5px;opacity:.5;font-weight:600}
.tx .am{font-size:16px;font-weight:700;white-space:nowrap}
.plus{color:#2E8B67}.minus{color:#C0505F}
.daysep{font-size:12.5px;font-weight:700;opacity:.45;margin:16px 0 4px}

/* ---------- parent ---------- */
.sheet{background:#fff;border-radius:26px;padding:20px;margin-bottom:14px;box-shadow:0 14px 34px -26px rgba(52,64,92,.9)}
.sheet h4{font-size:18px;font-weight:700;margin-bottom:3px}
.hint{font-size:13px;opacity:.55;margin:0 0 14px;line-height:1.45}
.fld{display:block;margin-bottom:11px}
.fld>span{display:block;font-size:12.5px;font-weight:700;opacity:.55;margin-bottom:5px}
.in{width:100%;min-height:46px;border-radius:14px;padding:9px 13px;font-size:15.5px;font-weight:600;
  background:#F5F7FB;border:2px solid transparent}
.in:focus{background:#fff;border-color:rgba(52,64,92,.22);outline:none}
textarea.in{min-height:70px;resize:vertical}
.duo{display:flex;gap:9px;flex-wrap:wrap}
.duo>.fld{flex:1;min-width:130px}
.chiprow{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:9px 14px;border-radius:999px;font-size:13.5px;font-weight:700;background:#F1F3F8;min-height:42px}
.chip.on{color:#fff}
.erow{display:flex;align-items:center;gap:7px;padding:8px 0;flex-wrap:wrap;border-bottom:1px solid rgba(52,64,92,.07)}
.erow:last-of-type{border-bottom:0}
.erow .ic{width:48px;flex:0 0 48px;text-align:center;font-size:19px;padding:9px 0;border-radius:12px;background:#F5F7FB;border:2px solid transparent}
.erow .tx2{flex:1;min-width:110px;min-height:42px;border-radius:12px;padding:8px 11px;font-size:14.5px;font-weight:600;background:#F5F7FB;border:2px solid transparent}
.erow .num{width:56px;flex:0 0 56px;min-height:42px;border-radius:12px;padding:8px;text-align:center;font-size:14.5px;font-weight:700;background:#F5F7FB;border:2px solid transparent}
.erow.off .tx2,.erow.off .ic{opacity:.35}
.mini{width:36px;height:36px;flex:0 0 36px;border-radius:11px;background:#F1F3F8;font-size:13.5px;display:grid;place-items:center}
.mini[disabled]{opacity:.25}
.mini.act{background:var(--soft)}
.wide-btn{width:100%;min-height:50px;border-radius:15px;margin-top:12px;font-size:14.5px;font-weight:700;background:#F1F3F8}
.wide-btn.prim{color:#fff}
.danger{color:#B4404F;background:#FBEEF0}
.ok{color:#1F7A55;background:#E7F5EE}
.pend{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid rgba(52,64,92,.07)}
.pend:last-of-type{border-bottom:0}
.pend .tt{flex:1;min-width:0}
.pend .tt b{display:block;font-size:15px;font-weight:700}
.pend .tt span{font-size:12px;opacity:.55;font-weight:600}
.sq{width:44px;height:44px;flex:0 0 44px;border-radius:14px;display:grid;place-items:center;font-size:17px}
.dash{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid rgba(52,64,92,.07)}
.dash:last-of-type{border-bottom:0}
.dash .face{width:50px;height:50px;flex:0 0 50px;border-radius:17px;display:grid;place-items:center;font-size:24px}
.state{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px}
.s-ok{background:#E7F5EE;color:#1F7A55}
.s-run{background:#FFF3DC;color:#9A6A16}
.s-no{background:#F1F3F8;color:#6B7590}
.empty{text-align:center;padding:28px 12px;opacity:.5;font-weight:600;font-size:14.5px;line-height:1.5}

/* ---------- pin ---------- */
.pin{max-width:330px;margin:52px auto 0;text-align:center}
.dots{display:flex;justify-content:center;gap:13px;margin:22px 0 6px}
.dot{width:14px;height:14px;border-radius:50%;background:rgba(52,64,92,.16)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.keys button{min-height:64px;border-radius:19px;font-size:22px;font-weight:700;background:#fff;
  box-shadow:0 10px 22px -20px rgba(52,64,92,.9)}
.keys button:active{transform:scale(.96)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}

/* ---------- overlays ---------- */
.veil{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:22px;
  background:rgba(45,52,72,.36);backdrop-filter:blur(7px);animation:fade .28s ease-out}
@keyframes fade{from{opacity:0}}
.modal{width:100%;max-width:400px;background:#fff;border-radius:34px;padding:30px 24px 24px;text-align:center;
  box-shadow:0 30px 70px -30px rgba(40,48,70,.7);animation:rise .45s cubic-bezier(.2,.9,.3,1.25);
  max-height:86vh;overflow:auto}
.modal.left{text-align:left}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.93)}}
.modal .big{font-size:62px;animation:bob 2.4s ease-in-out infinite}
.modal h3{font-size:25px;font-weight:700;margin:10px 0 6px}
.modal p{margin:0 0 6px;font-size:16px;opacity:.68;line-height:1.45}
.cta{width:100%;min-height:58px;border-radius:20px;margin-top:18px;font-size:18px;font-weight:700;color:#fff}
.cta:active{transform:scale(.985)}
.ghost{display:block;width:100%;margin-top:10px;padding:10px;font-size:13.5px;font-weight:700;opacity:.45}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120%);z-index:70;
  background:#34405C;color:#fff;padding:13px 20px;border-radius:999px;font-size:14.5px;font-weight:700;
  box-shadow:0 16px 34px -18px rgba(0,0,0,.6);transition:transform .35s cubic-bezier(.2,.9,.3,1.2);max-width:88vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
.sync{position:fixed;right:12px;top:12px;z-index:55;font-size:11px;font-weight:700;padding:5px 10px;
  border-radius:999px;background:rgba(255,255,255,.9);opacity:0;transition:opacity .3s;pointer-events:none}
.sync.on{opacity:.75}

@media(min-width:720px){
  .shell{padding:30px 24px 80px}
  .home-top h1{font-size:44px}
  .kids{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .kids .kid:first-child{grid-column:1/-1}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="fx"></canvas>
<div id="app"></div>
<div id="toast"></div>
<div id="sync" class="sync">☁️ synchro…</div>

<script>
/* ================================================================
   1. THÈMES
   ================================================================ */
const THEMES = {
  bleu:{label:"Bleu pastel",bg:"linear-gradient(178deg,#EEF4FC 0%,#FBFCFE 46%,#FDFBF7 100%)",soft:"#E4EDFA",tint:"#F4F8FE",acc:"#7FA3D4",deep:"#3D5578",conf:["#7FA3D4","#E6E1F5","#F6DDE0","#CFE3F7","#FBE3D2"]},
  turquoise:{label:"Vert turquoise",bg:"linear-gradient(178deg,#E8F5EF 0%,#FAFDFB 46%,#FDFBF7 100%)",soft:"#DCEFE6",tint:"#F2FAF6",acc:"#6EC3A5",deep:"#2F6B58",conf:["#6EC3A5","#BFE7D8","#F9E39B","#F6DDE0","#CDE9F3"]},
  soleil:{label:"Jaune soleil",bg:"linear-gradient(178deg,#FFF6E2 0%,#FFFBF2 46%,#FDFBF7 100%)",soft:"#FDECC9",tint:"#FFF9EC",acc:"#F2B451",deep:"#A9662B",conf:["#F2B451","#FBE3D2","#F6DDE0","#BFE7D8","#E6E1F5"]},
  rose:{label:"Rose poudré",bg:"linear-gradient(178deg,#FCEFF1 0%,#FEF9FA 46%,#FDFBF7 100%)",soft:"#F8E1E5",tint:"#FEF5F6",acc:"#E39CA8",deep:"#8E4E5C",conf:["#E39CA8","#F9E39B","#E6E1F5","#BFE7D8","#CFE3F7"]},
  lavande:{label:"Lavande",bg:"linear-gradient(178deg,#F1EEFB 0%,#FAF9FE 46%,#FDFBF7 100%)",soft:"#E6E1F5",tint:"#F7F5FD",acc:"#9C90D8",deep:"#4F4383",conf:["#9C90D8","#CFE3F7","#F6DDE0","#F9E39B","#BFE7D8"]},
  peche:{label:"Pêche",bg:"linear-gradient(178deg,#FDEEE2 0%,#FEF9F4 46%,#FDFBF7 100%)",soft:"#FBE3D2",tint:"#FEF6EF",acc:"#EFA477",deep:"#9E5227",conf:["#EFA477","#F9E39B","#F6DDE0","#CFE3F7","#BFE7D8"]}
};
const NEUTRAL = "linear-gradient(178deg,#F4F7FC 0%,#FDFBF7 55%,#FDF8F3 100%)";
const th = c => THEMES[c && c.theme] || THEMES.bleu;

/* ================================================================
   2. DATES
   ================================================================ */
const pad = n => String(n).padStart(2,"0");
const kOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => kOf(new Date());
const nowISO = () => new Date().toISOString();
const lastDays = n => { const a=[]; for(let i=0;i<n;i++){const d=new Date();d.setDate(d.getDate()-i);a.push(kOf(d));} return a; };
const pretty = (k) => {
  const d = k ? new Date(k+"T12:00:00") : new Date();
  const s = d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  return s.charAt(0).toUpperCase()+s.slice(1);
};
const prettyH = h => (h||"").replace(":","h").replace(/^0/,"");
const uid = p => (p||"x") + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36);

/* ================================================================
   3. DONNÉES PAR DÉFAUT — routines validées par la famille
   ================================================================ */
let sq = 0;
const T = (icon,label,group) => ({id:"t"+(++sq),icon,label,group:group||"",active:true});
const C = (icon,label,points,help) => ({id:"c"+(++sq),icon,label,points,help:!!help,active:true});

const DEFAULT = {
  pin:"1234",
  appPin:"2412",
  rev:1,
  settings:{ routineBonus:5, validateChores:true, notify:false },
  children:[
    {id:"noah",name:"Noah",level:"Collège",avatar:"🎧",tagline:"On avance tranquillement",theme:"bleu",style:"grand",
     targets:{morning:"07:45",evening:"21:30"},
     messages:{morning:"Routine terminée ! Bien joué 👌",evening:"Tout est prêt pour demain 👌"},
     routines:{
      morning:[
        T("⏰","Se réveiller et éteindre le réveil","Le lever"),
        T("🚽","Aller aux toilettes","Le lever"),
        T("🪟","Ouvrir les volets","Le lever"),
        T("🥣","Prendre son petit-déjeuner","Le petit-déj"),
        T("🧽","Débarrasser","Le petit-déj"),
        T("👕","S'habiller","Se préparer"),
        T("🪥","Se brosser les dents","Se préparer"),
        T("🪮","Se coiffer","Se préparer"),
        T("🧴","Crème et parfum","Se préparer"),
        T("👓","Nettoyer ses lunettes","Se préparer"),
        T("🛏️","Faire son lit","Se préparer"),
        T("🎒","Descendre ses sacs","Avant de partir"),
        T("🗓️","Vérifier l'emploi du temps et les devoirs","Avant de partir"),
        T("📱","Préparer son téléphone","Avant de partir"),
        T("💡","Vérifier que les lumières sont éteintes","Avant de partir"),
        T("🧥","Chaussures et manteau","Avant de partir")],
      evening:[
        T("🧥","Ranger manteau et chaussures","En rentrant"),
        T("🍎","Prendre son goûter","En rentrant"),
        T("🎒","Vider son sac","En rentrant"),
        T("✏️","Faire ses devoirs","Les devoirs"),
        T("🖊️","Faire signer les papiers","Les devoirs"),
        T("🗓️","Vérifier l'emploi du temps","Les devoirs"),
        T("🎒","Préparer son sac","Préparer demain"),
        T("🎽","Préparer ses affaires de sport","Préparer demain"),
        T("🍏","Mettre un goûter dans son sac","Préparer demain"),
        T("👕","Préparer ses vêtements","Préparer demain"),
        T("🎫","Carte de métro et carte d'école","Préparer demain"),
        T("📱","Pochette de téléphone","Préparer demain"),
        T("📓","Carnet de liaison","Préparer demain"),
        T("🍽️","Dîner","La soirée"),
        T("🚿","Prendre sa douche","La soirée"),

const KEY = "famille-routines-v3";
const CFGKEY = "famille-supabase";
const UNLOCK = "famille-unlock";
const mem = {};
const hasCS = typeof window!=="undefined" && window.storage && typeof window.storage.get==="function";

const local = {
  async get(k){
    if(hasCS){ try{ const r=await window.storage.get(k,false); return r?r.value:null; }catch(e){ return mem[k]||null; } }
    try{ return localStorage.getItem(k); }catch(e){ return mem[k]||null; }
  },
  async set(k,v){
    mem[k]=v;
    if(hasCS){ try{ await window.storage.set(k,v,false); return; }catch(e){ return; } }
    try{ localStorage.setItem(k,v); }catch(e){}
  }
};

let SB = {url:"",key:""};
// Accepte aussi bien https://xxx.supabase.co que https://xxx.supabase.co/rest/v1/
const sbBase = () => SB.url.trim().replace(/\/+$/,"").replace(/\/rest\/v1$/,"");
const sbOn = () => !!(SB.url && SB.key);
const sbHead = () => {
  // Les clés sb_publishable_… se transmettent uniquement dans l'en-tête apikey.
  // Les anciennes clés anon sont des JWT (eyJ…) et acceptent aussi Authorization.
  const h = {apikey:SB.key,"Content-Type":"application/json"};
  if(/^eyJ/.test(SB.key)) h.Authorization = "Bearer "+SB.key;
  return h;
};

async function sbLoad(){
  if(!sbOn()) return null;
  const r = await fetch(sbBase()+"/rest/v1/famille?id=eq.main&select=data,rev",{headers:sbHead()});
  if(!r.ok) throw new Error("Supabase "+r.status);
  const rows = await r.json();
  return rows[0] ? rows[0].data : null;
}
async function sbSave(data){
  if(!sbOn()) return;
  const r = await fetch(sbBase()+"/rest/v1/famille?on_conflict=id",{
    method:"POST",
    headers:Object.assign(sbHead(),{Prefer:"resolution=merge-duplicates,return=minimal"}),
    body:JSON.stringify({id:"main",data:data,rev:data.rev,updated_at:nowISO()})
  });
  if(!r.ok) throw new Error("Supabase "+r.status);
}

let saveTimer=null, savingBadge=null;
function flagSync(on){ const el=document.getElementById("sync"); if(el) el.classList.toggle("on",on); }
function save(){
  S.rev = (S.rev||0)+1;
  local.set(KEY, JSON.stringify(S));
  if(!sbOn()) return;
  clearTimeout(saveTimer);
  flagSync(true);
  saveTimer = setTimeout(async ()=>{
    try{ await sbSave(S); }catch(e){ toast("Synchro impossible : "+e.message); }
    flagSync(false);
  },600);
}

function childById(id){ return S.children.find(c=>c.id===id); }

function slot(id,tab){ return id+":"+tab; }

function isDone(id,tab,tid){ return doneList(id,tab).indexOf(tid)>=0; }
function activeList(c,tab){ return (c.routines[tab]||[]).filter(t=>t.active); }

function stats(id){
  const tx = S.tx.filter(t=>t.childId===id);
  const rm = tx.filter(t=>t.type==="routine_morning").length;
  const re = tx.filter(t=>t.type==="routine_evening").length;
  const chores = tx.filter(t=>t.type==="chore").length;
  const earned = tx.filter(t=>t.amount>0).reduce((a,t)=>a+t.amount,0);
  const days = {};
  tx.forEach(t=>{ if(t.type.indexOf("routine")===0) days[t.at.slice(0,10)]=true; });
  let streak=0;
  for(const d of lastDays(400)){ if(days[d]) streak++; else if(d!==today()) break; else continue; }
  return {rm,re,chores,earned,streak,balance:balance(id)};
}

function addTx(childId,amount,type,reason,by){
  S.tx.push({id:uid("tx"),childId,amount,type,reason,at:nowISO(),by:by||"system"});
  if(S.tx.length>4000) S.tx = S.tx.slice(-3000);
  checkMedals(childId);
}

function checkMedals(childId){
  const st = stats(childId);
  const got = S.awards.filter(a=>a.childId===childId).map(a=>a.medalId);
  MEDALS.forEach(m=>{
    if(got.indexOf(m.id)<0 && m.test(st)){
      S.awards.push({childId,medalId:m.id,at:nowISO()});
      const c = childById(childId);
      setTimeout(()=>{ ui.modal={kind:"medal",medal:m,childId}; render(); boom(th(c).conf,120); },500);
    }
  });
}

const cv = document.getElementById("fx"), cx = cv.getContext("2d");
let parts=[], raf=null;
function sizeCanvas(){ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio;
  cv.style.width=innerWidth+"px"; cv.style.height=innerHeight+"px"; cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
sizeCanvas(); addEventListener("resize",sizeCanvas);

function boom(colors,n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const N = n||70;
  for(let i=0;i<N;i++){
    parts.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*0.3,
      vx:(Math.random()-.5)*1.6,vy:2+Math.random()*3.4,
      s:5+Math.random()*8,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.25,
      c:colors[i%colors.length],round:Math.random()>.55,life:1});
  }
  if(!raf) raf=requestAnimationFrame(tick);
}
function burst(x,y,colors){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for(let i=0;i<18;i++){
    const a=Math.random()*Math.PI*2, sp=1.5+Math.random()*4;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.5,s:4+Math.random()*5,
      r:Math.random()*3,vr:(Math.random()-.5)*.3,c:colors[i%colors.length],round:true,life:1});
  }
  if(!raf) raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p=>p.life>0 && p.y<innerHeight+40);
  parts.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.045; p.r+=p.vr; p.life-=0.004;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.globalAlpha=Math.max(p.life,0); cx.fillStyle=p.c;
    if(p.round){ cx.beginPath(); cx.arc(0,0,p.s/2,0,7); cx.fill(); }
    else cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.6);
    cx.restore();
  });
  if(parts.length) raf=requestAnimationFrame(tick); else { raf=null; cx.clearRect(0,0,innerWidth,innerHeight); }
}
let tt=null;
function toast(msg){
  const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("on");
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("on"),2800);
}

function toggleStep(childId,tab,tid){
  const c=childById(childId), k=slot(childId,tab);
  const cur = S.day.done[k] ? S.day.done[k].slice() : [];
  const at = cur.indexOf(tid);
  if(at>=0) cur.splice(at,1); else cur.push(tid);
  S.day.done[k]=cur;

  if(tab==="chores"){
    const chore = c.routines.chores.find(x=>x.id===tid);
    if(at<0){
      if(S.settings.validateChores){
        S.pending.push({id:uid("pd"),kind:"chore",childId,refId:tid,label:chore.label,icon:chore.icon,points:chore.points,at:nowISO()});
        toast("Envoyé aux parents pour validation ⏳");
      }else{
        addTx(childId,chore.points,"chore",chore.label,"auto");
        toast("+"+chore.points+" points ⭐");
      }
    }else{
      S.pending = S.pending.filter(p=>!(p.kind==="chore"&&p.childId===childId&&p.refId===tid));
    }
  }else{
    const list=activeList(c,tab);
    const all = list.length>0 && list.every(t=>S.day.done[k].indexOf(t.id)>=0);
    const flag = childId+":"+tab;
    if(all && !S.day.awarded[flag]){
      S.day.awarded[flag]=true;
      addTx(childId,S.settings.routineBonus,"routine_"+tab,
        tab==="morning"?"Routine du matin":"Routine du soir","auto");
      ui.modal={kind:"routine",childId,tab};
      setTimeout(()=>boom(th(c).conf,110),120);
    }
  }
  save(); render();
}

function askReward(childId,rid){
  const r = S.rewards.find(x=>x.id===rid);
  if(balance(childId) < r.cost){ toast("Il manque "+(r.cost-balance(childId))+" points"); return; }
  if(S.pending.some(p=>p.kind==="reward"&&p.childId===childId&&p.refId===rid)){ toast("Déjà demandé ⏳"); return; }
  S.pending.push({id:uid("pd"),kind:"reward",childId,refId:rid,label:r.label,icon:r.icon,points:r.cost,at:nowISO()});
  save(); render(); toast("Demande envoyée aux parents ⏳");
}

function decide(pid,ok){
  const p = S.pending.find(x=>x.id===pid); if(!p) return;
  S.pending = S.pending.filter(x=>x.id!==pid);
  const c = childById(p.childId);
  if(p.kind==="chore"){
    if(ok){
      addTx(p.childId,p.points,"chore",p.label,"parent");
      const k=slot(p.childId,"chores");
      S.day.validated[k]=(S.day.validated[k]||[]).concat([p.refId]);
      toast(c.name+" : +"+p.points+" points");
      boom(th(c).conf,70);
    }else{
      const k=slot(p.childId,"chores");
      S.day.done[k]=(S.day.done[k]||[]).filter(x=>x!==p.refId);
      toast("Tâche renvoyée à "+c.name);
    }
  }else{
    if(ok){ addTx(p.childId,-p.points,"reward",p.label,"parent"); toast("Récompense accordée 🎁"); }
    else toast("Demande refusée");
  }
  save(); render();
}

        +'<span class="sc" style="color:'+T2.deep+'">⭐ '+b+' points</span>'
        +'<span class="chips">'+mk("morning")+mk("evening")
          +'<span class="mini-chip">🧹 '+ch+'</span>'
          +(wait?'<span class="mini-chip s-run">⏳ '+wait+'</span>':"")

function viewChild(){
  const c = childById(ui.kid), T2 = th(c), tab = ui.tab;
  const TABS=[["morning","☀️","Matin"],["evening","🌙","Soir"],["chores","🧹","Maison"],["rewards","🎁","Récompenses"],["medals","🏅","Médailles"]];
  let head = '<div class="topbar">'
    +'<button class="pill" data-a="home" style="color:'+T2.deep+'">← Changer de profil</button>'
    +'<button class="icon-btn grow" data-a="gate" aria-label="Espace parents">⚙</button></div>'
    +'<div class="head"><span class="face" style="background:'+T2.soft+'">'+c.avatar+'</span>'
    +'<div><h2 style="color:'+T2.deep+'">'+esc(c.name)+'</h2><div class="sub">'+pretty()+'</div></div>'
    +'<div class="score" style="color:'+T2.deep+'"><b>⭐ '+balance(c.id)+'</b><span>MES POINTS</span></div></div>'
    +'<div class="tabs">'+TABS.map(t=>'<button class="tab'+(tab===t[0]?" on":"")+'" data-a="tab" data-tab="'+t[0]+'" style="'+(tab===t[0]?"background:"+T2.acc:"color:"+T2.deep)+'"><span class="em">'+t[1]+'</span>'+t[2]+'</button>').join("")+'</div>';

  const todayRem = S.reminders.filter(r=>r.active && (r.who==="all"||r.who===c.id) && r.days.indexOf(new Date().getDay())>=0);
  const remHTML = todayRem.length ? '<div class="card" style="background:'+T2.tint+'"><div class="rowb"><span class="l" style="font-size:14.5px;color:'+T2.deep+'">🔔 Aujourd\'hui</span></div><div style="font-size:14px;font-weight:600;opacity:.7;margin-top:6px;line-height:1.5">'+todayRem.map(r=>prettyH(r.time)+" — "+esc(r.label)).join("<br>")+'</div></div>' : "";

  let body="";
  if(tab==="morning"||tab==="evening"){
    const list=activeList(c,tab), d=doneList(c.id,tab).filter(x=>list.some(t=>t.id===x)).length;
    const pct = list.length?Math.round(d/list.length*100):0;
    const starLine = d?("⭐".repeat(Math.min(d,18))+(d>18?" +"+(d-18):"")):"";
    body = remHTML
      +'<div class="card"><div class="rowb"><span class="l" style="color:'+T2.deep+'">'+d+' / '+list.length+' '+(c.style==="petit"?"images":"tâches")+(d===list.length&&list.length?" 🎉":"")+'</span>'
      +'<span class="r">'+(tab==="morning"?"Prêt à "+prettyH(c.targets.morning):"Au lit à "+prettyH(c.targets.evening))+'<br>Routine complète : +'+S.settings.routineBonus+' ⭐</span></div>'
      +'<div class="bar" style="background:'+T2.soft+'"><i style="width:'+pct+'%;background:'+T2.acc+'"></i></div>'
      +'<div class="stars">'+(d?starLine:'<span class="n">Coche ta première étape</span>')+'</div></div>'
      +listHTML(c,tab);
  }
  else if(tab==="chores"){
    const list=activeList(c,"chores");
    const doneIds=doneList(c.id,"chores");
    const pts=list.filter(t=>doneIds.indexOf(t.id)>=0).reduce((a,t)=>a+t.points,0);
    const val=(S.day.validated[slot(c.id,"chores")]||[]).length;
    body='<div class="card"><div class="rowb"><span class="l" style="color:'+T2.deep+'">'+pts+' points demandés aujourd\'hui</span>'
      +'<span class="r">'+val+' validée'+(val>1?"s":"")+'</span></div>'
      +'<div class="stars"><span class="n">Rien n\'est obligatoire. Chaque coup de main compte, un parent valide ensuite.</span></div></div>'
      +listHTML(c,"chores");
  }
  else if(tab==="rewards"){
    const b=balance(c.id);
    const cards=S.rewards.filter(r=>r.active).map(r=>{
      const asked=S.pending.some(p=>p.kind==="reward"&&p.childId===c.id&&p.refId===r.id);
      const okp=b>=r.cost;
      return '<div class="rw"><div class="ic">'+r.icon+'</div><div class="nm">'+esc(r.label)+'</div>'
        +'<div class="co">⭐ '+r.cost+'</div>'
        +'<button data-a="ask" data-kid="'+c.id+'" data-id="'+r.id+'" '+(asked||!okp?"disabled":"")
        +' style="background:'+(asked?"#9AA4BC":T2.acc)+'">'+(asked?"En attente ⏳":(okp?"Échanger":"Encore "+(r.cost-b)))+'</button></div>';
    }).join("");
    body='<div class="card"><div class="rowb"><span class="l" style="color:'+T2.deep+'">Tu as ⭐ '+b+' points</span></div>'
      +'<div class="stars"><span class="n">Choisis une récompense, un parent la valide.</span></div></div>'
      +'<div class="grid">'+(cards||'<p class="empty">Aucune récompense pour l\'instant.</p>')+'</div>';
  }
  else {
    const got=S.awards.filter(a=>a.childId===c.id).map(a=>a.medalId);
    const st=stats(c.id);
    const meds=MEDALS.map(m=>'<div class="med'+(got.indexOf(m.id)>=0?" got":"")+'"><div class="ic">'+m.icon+'</div>'
      +'<div class="nm">'+m.label+'</div><div class="ds">'+m.desc+'</div></div>').join("");
    const mine=S.tx.filter(t=>t.childId===c.id).slice(-14).reverse();
    body='<div class="card"><div class="rowb"><span class="l" style="color:'+T2.deep+'">'+got.length+' / '+MEDALS.length+' médailles</span>'
      +'<span class="r">'+st.streak+' jour'+(st.streak>1?"s":"")+' d\'affilée 🔥</span></div></div>'
      +'<div class="grid">'+meds+'</div>'
      +'<div class="card solid" style="margin-top:16px"><h4>Mon historique</h4><p class="hint">Les 14 derniers mouvements de points.</p>'
      +(mine.length?mine.map(txHTML).join(""):'<p class="empty">Rien encore.</p>')+'</div>';
  }
  return '<div class="shell">'+head+body+'</div>'+modalHTML();
}

function txHTML(t){
  const ic={routine_morning:"🌅",routine_evening:"🌙",chore:"🧹",bonus:"🎁",malus:"⚠️",reward:"🛍️"}[t.type]||"⭐";
  const d=new Date(t.at);
  return '<div class="tx"><span class="ic">'+ic+'</span><span class="tt"><b>'+esc(t.reason)+'</b>'
    +'<span>'+pad(d.getDate())+"/"+pad(d.getMonth()+1)+" · "+pad(d.getHours())+"h"+pad(d.getMinutes())+'</span></span>'
    +'<span class="am '+(t.amount>=0?"plus":"minus")+'">'+(t.amount>=0?"+":"")+t.amount+'</span></div>';
}

function viewParent(){
  const P=[["dash","📊","Aujourd'hui"],["valid","🔔","Validations"],["points","⭐","Points"],
           ["hist","🕓","Historique"],["lists","✏️","Listes"],["rem","🔔","Rappels"],["set","⚙️","Réglages"]];
  const n=S.pending.length;
  let out='<div class="shell wide"><div class="topbar"><button class="pill" data-a="home">← Retour aux profils</button></div>'
    +'<h2 style="font-size:25px;margin-bottom:14px">Espace parents</h2>'
    +'<div class="tabs">'+P.map(p=>'<button class="tab'+(ui.ptab===p[0]?" on":"")+'" data-a="ptab" data-t="'+p[0]+'" style="'+(ui.ptab===p[0]?"background:var(--acc)":"")+'"><span class="em">'+p[1]+'</span>'+p[2]
      +(p[0]==="valid"&&n?'<span class="badge-dot">'+n+'</span>':"")+'</button>').join("")+'</div>';

  if(ui.ptab==="dash") out+=pDash();
  else if(ui.ptab==="valid") out+=pValid();
  else if(ui.ptab==="points") out+=pPoints();

  else if(ui.ptab==="rem") out+=pRem();

  return out+'</div>'+modalHTML();
}

function pDash(){
  const rows=S.children.map(c=>{
    const st=(tab)=>{
      const l=activeList(c,tab), d=doneList(c.id,tab).length;
      if(!l.length) return '<span class="state s-no">—</span>';
      if(d===l.length) return '<span class="state s-ok">'+(tab==="morning"?"Matin":"Soir")+' ✅</span>';
      if(d>0) return '<span class="state s-run">'+(tab==="morning"?"Matin":"Soir")+' '+d+'/'+l.length+'</span>';
      return '<span class="state s-no">'+(tab==="morning"?"Matin":"Soir")+' —</span>';
    };
    const w=S.pending.filter(p=>p.childId===c.id).length;
    return '<div class="dash"><span class="face" style="background:'+th(c).soft+'">'+c.avatar+'</span>'
      +'<div style="flex:1;min-width:0"><b style="font-size:16.5px">'+esc(c.name)+'</b>'
      +'<div style="font-size:13.5px;font-weight:700;color:'+th(c).deep+';margin:2px 0 6px">⭐ '+balance(c.id)+' points</div>'
      +'<div style="display:flex;flex-wrap:wrap;gap:5px">'+st("morning")+st("evening")
      +'<span class="state s-no">🧹 '+doneList(c.id,"chores").length+'</span>'
      +(w?'<span class="state s-run">⏳ '+w+' à valider</span>':"")+'</div></div>'
      +'<button class="mini" data-a="open-kid" data-kid="'+c.id+'" aria-label="Voir">›</button></div>';
  }).join("");
  return '<div class="sheet"><h4>Où en est chacun</h4><p class="hint">Mis à jour en direct '+(sbOn()?"sur tous les appareils.":"sur cet appareil.")+'</p>'+rows+'</div>'
    +'<div class="sheet"><h4>Actions rapides</h4>'
    +'<button class="wide-btn prim" style="background:#7FA3D4" data-a="modal" data-m="bonus">🎁 Donner un bonus</button>'
    +'<button class="wide-btn danger" data-a="modal" data-m="malus">⚠️ Appliquer un malus</button>'
    +'<button class="wide-btn" data-a="ptab" data-t="lists">✏️ Modifier une routine ou une liste</button></div>';
}

function pValid(){
  if(!S.pending.length) return '<div class="sheet"><h4>Rien à valider</h4><p class="hint">Les tâches terminées et les demandes de récompense arriveront ici.</p></div>';
  const rows=S.pending.slice().reverse().map(p=>{
    const c=childById(p.childId), d=new Date(p.at);
    return '<div class="pend"><span class="sq" style="background:'+th(c).soft+'">'+p.icon+'</span>'
      +'<span class="tt"><b>'+esc(c.name)+' — '+esc(p.label)+'</b>'
      +'<span>'+(p.kind==="chore"?"+"+p.points+" points":"récompense · −"+p.points+" points")
      +' · '+pad(d.getHours())+"h"+pad(d.getMinutes())+'</span></span>'
      +'<button class="sq ok" data-a="dec" data-id="'+p.id+'" data-ok="1">✓</button>'
      +'<button class="sq danger" data-a="dec" data-id="'+p.id+'" data-ok="0">✕</button></div>';
  }).join("");
  return '<div class="sheet"><h4>En attente ('+S.pending.length+')</h4><p class="hint">Valider crédite les points, refuser renvoie la tâche à l\'enfant.</p>'+rows+'</div>';
}

function pPoints(){
  const rows=S.children.map(c=>{

    return '<div class="dash"><span class="face" style="background:'+th(c).soft+'">'+c.avatar+'</span>'

      +'<button class="mini" data-a="rw-tog" data-i="'+i+'">'+(r.active?"👁":"🚫")+'</button>'
      +'<button class="mini danger" data-a="rw-del" data-i="'+i+'">✕</button></div>').join("")

    +'<div class="sheet"><h4>Motifs de malus</h4><p class="hint">Le montant proposé par défaut reste modifiable au moment de l\'appliquer.</p>'
    +S.penalties.map((p,i)=>'<div class="erow">'
      +'<input class="tx2" data-f="penalties.'+i+'.label" value="'+esc(p.label)+'">'
      +'<input class="num" data-f="penalties.'+i+'.amount" inputmode="numeric" value="'+p.amount+'">'
      +'<button class="mini danger" data-a="pen-del" data-i="'+i+'">✕</button></div>').join("")
    +'<button class="wide-btn" data-a="pen-add">+ Ajouter un motif</button></div>';
}

function pHist(){
  const byDay={};
  S.tx.slice().reverse().forEach(t=>{ const d=t.at.slice(0,10); (byDay[d]=byDay[d]||[]).push(t); });
  const days=Object.keys(byDay).sort().reverse().slice(0,20);
  if(!days.length) return '<div class="sheet"><h4>Historique</h4><p class="hint">Aucun mouvement pour le moment.</p></div>';
  const body=days.map(d=>{
    const tot=byDay[d].reduce((a,t)=>a+t.amount,0);
    return '<div class="daysep">'+pretty(d)+' · '+(tot>=0?"+":"")+tot+'</div>'
      +byDay[d].map(t=>{
        const c=childById(t.childId);
        return txHTML({...t,reason:(c?c.name+" — ":"")+t.reason});
      }).join("");
  }).join("");
  return '<div class="sheet"><h4>Historique complet</h4><p class="hint">Chaque point a une origine : routine, tâche validée, bonus, malus ou récompense.</p>'+body+'</div>';
}

      +'<label class="fld"><span>Message de fin — matin</span><input class="in" data-f="child.'+c.id+'.messages.morning" value="'+esc(c.messages.morning)+'"></label>'

function setPath(path,val){
  // child.<id>.<champ...>  |  rewards.<i>.<champ>  |  settings.<champ>  |  pin
  const p=path.split(".");
  if(p[0]==="child"){
    const c=childById(p[1]); if(!c) return;
    if(p[2]==="morning"||p[2]==="evening"||p[2]==="chores"){ c.routines[p[2]][+p[3]][p[4]]=val; }
    else if(p[2]==="targets"||p[2]==="messages"){ c[p[2]][p[3]]=val; }
    else c[p[2]]=val;
  } else if(p[0]==="rewards"||p[0]==="penalties"||p[0]==="reminders"){
    S[p[0]][+p[1]][p[2]]=val;
  } else if(p[0]==="settings"){ S.settings[p[1]]=val; }
  else S[p[0]]=val;
}

document.addEventListener("input",e=>{
  const el=e.target.closest("[data-f]"); if(!el) return;
  let v=el.value;
  if(/\.(points|cost|amount|routineBonus)$/.test(el.dataset.f)){ v=parseInt(String(v).replace(/\D/g,""),10); if(isNaN(v))v=0; }
  if(el.dataset.f==="pin") v=String(v).replace(/\D/g,"").slice(0,4);
  if(el.dataset.f==="appPin"){
    v=String(v).replace(/\D/g,"").slice(0,4);
    // l'appareil qui change le code reste déverrouillé, les autres devront le ressaisir
    if(v.length===4) local.set(UNLOCK,v);
  }
  setPath(el.dataset.f,v);
  save();
});

document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-a]"); if(!el) return;
  const a=el.dataset.a, ed=ui.edit, c0=childById(ed.kid)||S.children[0];

  if(a==="close-veil" && e.target!==el) return;

  switch(a){
    case "pick":
      ui.kid=el.dataset.kid; ui.tab=new Date().getHours()<15?"morning":"evening";
      ui.screen="child"; break;
    case "home": ui.screen="home"; ui.modal=null; break;
    case "back": ui.screen=ui.kid?"child":"home"; ui.pin=""; break;
    case "tab": ui.tab=el.dataset.tab; break;
    case "gate": ui.screen="gate"; ui.pin=""; ui.bad=false; break;
    case "ptab": ui.ptab=el.dataset.t; break;
    case "open-kid": ui.kid=el.dataset.kid; ui.screen="child"; ui.tab="morning"; break;
    case "close": case "close-veil": ui.modal=null; break;

    case "lkey": {
      const d=el.dataset.d;
      if(d==="c") ui.lock="";
      else if(d==="b") ui.lock=ui.lock.slice(0,-1);
      else ui.lock=(ui.lock+d).slice(0,4);
      if(ui.lock.length===4){
        if(ui.lock===S.appPin){
          await local.set(UNLOCK,S.appPin);
          ui.lock=""; ui.bad=false; ui.screen="home";
          pull();
        } else { ui.bad=true; ui.lock=""; setTimeout(()=>{ui.bad=false;render();},450); }
      }
      break;
    }
    case "lock-now": { await local.set(UNLOCK,""); ui.screen="lock"; ui.lock=""; break; }

    case "key": {
      const d=el.dataset.d;
      if(d==="c") ui.pin="";
      else if(d==="b") ui.pin=ui.pin.slice(0,-1);
      else ui.pin=(ui.pin+d).slice(0,4);
      if(ui.pin.length===4){
        if(ui.pin===S.pin){ ui.screen="parent"; ui.pin=""; ui.bad=false; }
        else { ui.bad=true; ui.pin=""; setTimeout(()=>{ui.bad=false;render();},450); }
      }
      break;
    }

    case "step": {
      const r=el.getBoundingClientRect();
      const kid=el.dataset.kid, tab=el.dataset.tab, id=el.dataset.id;
      if(tab==="chores" && (S.day.validated[slot(kid,tab)]||[]).indexOf(id)>=0){ toast("Déjà validée par un parent ✅"); return; }
      if(!isDone(kid,tab,id)) burst(r.left+34,r.top+r.height/2,th(childById(kid)).conf);
      toggleStep(kid,tab,id); return;
    }
    case "ask": askReward(el.dataset.kid,el.dataset.id); return;
    case "dec": decide(el.dataset.id, el.dataset.ok==="1"); return;

    /* --- modales bonus / malus --- */
    case "modal": ui.modal={kind:el.dataset.m,childId:S.children[0].id,amount:el.dataset.m==="bonus"?20:10,reason:""}; break;
    case "mod-kid": ui.modal.childId=el.dataset.kid; break;
    case "mod-reason": ui.modal.reason=el.dataset.r; ui.modal.amount=+el.dataset.am; break;
    case "mod-apply": {
      const amt=Math.abs(parseInt((document.getElementById("mamount")||{}).value||"0",10))||0;
      const rsn=((document.getElementById("mreason")||{}).value||"").trim();
      if(!amt){ toast("Indique un nombre de points"); return; }
      const kid=ui.modal.childId, isB=ui.modal.kind==="bonus";
      addTx(kid, isB?amt:-amt, isB?"bonus":"malus", rsn || (isB?"Bonus":"Malus"), "parent");
      toast(childById(kid).name+" : "+(isB?"+":"−")+amt+" points");
      if(isB) boom(th(childById(kid)).conf,60);
      ui.modal=null; save(); break;
    }

    /* --- édition listes --- */
    case "ed-kid": ed.kid=el.dataset.kid; break;
    case "ed-list": ed.list=el.dataset.l; break;
    case "ed-theme": c0.theme=el.dataset.k; save(); break;
    case "ed-style": c0.style=el.dataset.s; save(); break;
    case "st-move": {
      const i=+el.dataset.i, d=+el.dataset.d, arr=c0.routines[ed.list], j=i+d;
      if(j<0||j>=arr.length) return;
      const t=arr[i]; arr[i]=arr[j]; arr[j]=t; save(); break;
    }
    case "st-tog": { const t=c0.routines[ed.list][+el.dataset.i]; t.active=!t.active; save(); break; }
    case "st-help": { const t=c0.routines[ed.list][+el.dataset.i]; t.help=!t.help; save(); break; }
    case "st-del": { c0.routines[ed.list].splice(+el.dataset.i,1); save(); break; }
    case "st-add": {
      const isCh=ed.list==="chores", arr=c0.routines[ed.list];
      arr.push({id:uid(isCh?"c":"t"),icon:isCh?"🧹":"✅",
        label:isCh?"Nouvelle tâche":"Nouvelle étape",
        group:isCh?"":(arr.length?arr[arr.length-1].group:""),
        points:isCh?5:undefined,help:false,active:true});
      save(); break;
    }
    case "kid-add": {
      const id=uid("k");
      S.children.push({id,name:"Nouvel enfant",level:"",avatar:"🙂",tagline:"",theme:"lavande",style:"enfant",
        targets:{morning:"08:00",evening:"20:30"},
        messages:{morning:"Routine terminée ! 👌",evening:"Tout est prêt 👌"},
        routines:{morning:[],evening:[],chores:[]}});
      ed.kid=id; save(); break;
    }
    case "kid-del": {
      if(S.children.length<=1){ toast("Il faut au moins un enfant"); return; }
      if(!confirm("Supprimer ce profil ? L'historique de ses points sera conservé.")) return;
      S.children=S.children.filter(x=>x.id!==el.dataset.kid); ed.kid=S.children[0].id; save(); break;
    }

    /* --- récompenses / motifs --- */
    case "rw-add": S.rewards.push({id:uid("r"),icon:"🎁",label:"Nouvelle récompense",cost:50,active:true}); save(); break;
    case "rw-del": S.rewards.splice(+el.dataset.i,1); save(); break;
    case "rw-tog": { const r=S.rewards[+el.dataset.i]; r.active=!r.active; save(); break; }
    case "rw-move": { const i=+el.dataset.i,d=+el.dataset.d,j=i+d; if(j<0||j>=S.rewards.length) return;
      const t=S.rewards[i]; S.rewards[i]=S.rewards[j]; S.rewards[j]=t; save(); break; }
    case "pen-add": S.penalties.push({id:uid("p"),label:"Nouveau motif",amount:10}); save(); break;
    case "pen-del": S.penalties.splice(+el.dataset.i,1); save(); break;

    /* --- rappels --- */
    case "rem-add": S.reminders.push({id:uid("rm"),label:"Nouveau rappel",time:"18:00",days:[1,2,3,4,5],who:"all",active:true}); save(); break;
    case "rem-del": S.reminders.splice(+el.dataset.i,1); save(); break;
    case "rem-day": { const r=S.reminders[+el.dataset.i], j=+el.dataset.j;
      const k=r.days.indexOf(j); if(k>=0) r.days.splice(k,1); else r.days.push(j); save(); break; }
    case "rem-who": S.reminders[+el.dataset.i].who=el.dataset.w; save(); break;
    case "notify": {
      if(!("Notification" in window)){ toast("Ce navigateur ne gère pas les notifications"); return; }
      const p=await Notification.requestPermission();
      S.settings.notify = (p==="granted");
      toast(S.settings.notify?"Notifications activées":"Notifications refusées"); save(); break;
    }

    /* --- réglages --- */
    case "tog-valid": S.settings.validateChores=!S.settings.validateChores; save(); break;
    case "sb-save": {
      SB.url=(document.getElementById("sburl").value||"").trim();
      SB.key=(document.getElementById("sbkey").value||"").trim();
      await local.set(CFGKEY,JSON.stringify(SB));
      if(sbOn()){
        try{
          const remote=await sbLoad();
          if(remote && confirm("Des données existent déjà sur Supabase. Les récupérer ? (Annuler = envoyer les données de cet appareil)")){
            S=migrate(remote);
          }
          await sbSave(S); toast("Connecté ☁️"); startPoll();
        }catch(err){ toast("Échec : "+err.message); }
      } else toast("Champs vides : mode local");
      break;
    }
    case "sb-pull": {
      try{ const r=await sbLoad(); if(r){ S=migrate(r); toast("Rechargé ☁️"); } else toast("Aucune donnée distante"); }
      catch(err){ toast("Échec : "+err.message); }
      break;
    }
    case "export": {
      const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
      const a2=document.createElement("a"); a2.href=URL.createObjectURL(blob);
      a2.download="famille-routines-"+today()+".json"; a2.click(); return;
    }
    case "reset-day": if(confirm("Remettre la journée à zéro pour tout le monde ?")){ S.day={date:today(),done:{},validated:{},awarded:{}}; save(); } break;
    case "reset-all": if(confirm("Tout effacer, y compris l'historique des points ?")){ S=migrate(JSON.parse(JSON.stringify(DEFAULT))); save(); } break;
  }
  render();
});

/* ================================================================
   12. DÉMARRAGE + SYNCHRO
   ================================================================ */
function migrate(raw){
  const d=JSON.parse(JSON.stringify(DEFAULT));
  const s=Object.assign(d,raw||{});
  s.settings=Object.assign({},d.settings,raw&&raw.settings||{});
  s.tx=s.tx||[]; s.pending=s.pending||[]; s.awards=s.awards||[];
  s.day=s.day||{date:today(),done:{},validated:{},awarded:{}};
  s.day.done=s.day.done||{}; s.day.validated=s.day.validated||{}; s.day.awarded=s.day.awarded||{};
  return s;
}

let pollTimer=null;

// Relit Supabase et applique la version distante si elle est plus récente.
async function pull(){
  if(!sbOn()) return false;
  try{
    const r=await sbLoad();
    if(r && (r.rev||0) > (S.rev||0)){
      const sc=ui.screen; S=migrate(r); rollover(); ui.screen=sc; render(); return true;
    }
  }catch(e){}
  return false;
}

function startPoll(){
  clearInterval(pollTimer);
  if(!sbOn()) return;
  pollTimer=setInterval(()=>{ if(!document.hidden) pull(); },9000);
}

function checkReminders(){
  if(!S.settings.notify || !("Notification" in window) || Notification.permission!=="granted") return;
  const n=new Date(), hm=pad(n.getHours())+":"+pad(n.getMinutes()), dow=n.getDay();
  S.reminders.forEach(r=>{
    if(!r.active||r.time!==hm||r.days.indexOf(dow)<0) return;
    const tag="rm-"+r.id+"-"+today()+"-"+hm;
    if(sessionStorage.getItem(tag)) return;
    try{ sessionStorage.setItem(tag,"1"); }catch(e){}
    const who = r.who==="all" ? "Tout le monde" : (childById(r.who)||{name:""}).name;
    new Notification("🔔 "+r.label,{body:who});
  });
}

(async function init(){
  try{ const cfg=await local.get(CFGKEY); if(cfg) SB=Object.assign(SB,JSON.parse(cfg)); }catch(e){}
  let loaded=null;
  if(sbOn()){
    try{ loaded=await sbLoad(); }
    catch(e){ toast("Supabase injoignable, mode local"); }
  }
  if(!loaded){ try{ const raw=await local.get(KEY); if(raw) loaded=JSON.parse(raw); }catch(e){} }
  S = migrate(loaded);
  if(rollover()) save();
  let unlocked=null;
  try{ unlocked = await local.get(UNLOCK); }catch(e){}
  if(S.appPin && unlocked !== S.appPin) ui.screen="lock";
  render();
  startPoll();
  setInterval(()=>{ if(rollover()){ save(); render(); } checkReminders(); }, 20000);
  document.addEventListener("visibilitychange",()=>{
    if(document.hidden) return;
    if(rollover()){ save(); }
    render();
    pull();
  });
})();
</script>
</body>
